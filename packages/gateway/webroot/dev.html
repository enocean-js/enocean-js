<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enocean Gateway - Dashboard</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .layout {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }

      .main-content {
        flex: 1;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header-component></header-component>
      <!--<ed-prop-list></ed-prop-list>-->
      <div class="main-content">
        <h2>Send Raw Packet</h2>
        <p>
          Send a raw packet by specifying the packet type, data and optional
          data (all in hex format, e.g. ffe1ca81).
        </p>

        <br />
        <br />
        <label for="packetType">Packet Type:</label>
        <input
          id="packetType"
          type="text"
          placeholder="Packet Type"
          value="1"
        />
        <br />
        <br />
        <label for="data">Data:</label>
        <input id="data" type="text" placeholder="Data" />
        <span>d1004609ffe1ca8100</span>
        <br />
        <br />
        <label for="optionalData">Optional Data:</label>
        <input
          id="optionalData"
          type="text"
          placeholder="Optional Data"
          value="03ffffffffff00"
        /><br />
        <br />
        <div id="telegramStringOutput"></div>
        <button id="sendButton">Send Packet</button>
        <div id="result"></div>
        <enocean-monitor filter="d1"></enocean-monitor>
        <script type="module">
          import "./components/header.js";
          import "./components/monitor.js";
          import "./components/ed-prop-list.js";
          import { GatewayApiClient, utils } from "./gateway-api-client.js";
          const apiClient = new GatewayApiClient();

          let telegram = null;
          const sendButton = document.getElementById("sendButton");
          const telegramStringOutput = document.getElementById(
            "telegramStringOutput"
          );
          const optionalData = document.getElementById("optionalData");
          optionalData.oninput = (event) => {
            makePacket();
            console.log("Optional Data changed:", event.target.value);
          };
          const data = document.getElementById("data");
          data.oninput = (event) => {
            makePacket();
            console.log("Data changed:", event.target.value);
          };
          const packetType = document.getElementById("packetType");
          packetType.oninput = (event) => {
            makePacket();
            console.log("Packet Type changed:", event.target.value);
          };

          sendButton.addEventListener("click", () => {
            apiClient.send(telegram).then((response) => {
              result.innerHTML = JSON.stringify(response, null, 2);
            });
          });
          function makePacket() {
            const packetType = document.getElementById("packetType").value;
            const data = document.getElementById("data").value;
            const optionalData = document.getElementById("optionalData").value;

            let packet = utils.createESP3Telegram(packetType);
            packet = utils.setData(packet, utils.fromString(data));
            packet = utils.setOptionalData(
              packet,
              utils.fromString(optionalData)
            );
            telegram = utils.toString(packet);
            telegramStringOutput.innerHTML = telegram;
          }
        </script>
      </div>
    </div>
  </body>
</html>
