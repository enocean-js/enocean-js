<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enocean Gateway - Dashboard</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .layout {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }

      .main-content {
        flex: 1;
        padding: 20px;
      }
      .tele {
        color: grey;
        font-size: 1.1em;
        display: flex;
        flex-direction: row;
        align-items: center;
        margin-bottom: 10px;
        font-family: monospace;
      }
      span[contenteditable="true"] {
        border-bottom: 1px dashed #ccc;
        padding: 2px 4px;
        box-sizing: border-box;
        font-size: 1.5em;
        color: black;
      }
      span[contenteditable="true"]:focus {
        outline: none;
      }
      span[contenteditable="true"].err {
        border-bottom-color: red;
      }
      #packetType {
        width: 2em;
        text-align: center;
        padding: 2px 4px;
        box-sizing: border-box;
      }
      #sendButton {
        font-family: "Material Symbols Rounded";
        font-size: 1.5em;
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header-component></header-component>
      <!--<ed-prop-list></ed-prop-list>-->
      <div class="main-content">
        <h2>Send Raw Packet</h2>
        <p>
          Send a raw packet by specifying the packet type, data and optional
          data (all in hex format, e.g. ffe1ca81).
        </p>

        <br />
        <br />

        <div class="tele">
          <span>55</span>. <span id="dataLength">0001</span>.
          <span id="optionalLength">00</span>.
          <span id="packetType" contenteditable="true" spellcheck="false"
            >01</span
          >. <span id="headerCRC">00</span>.
          <span id="data" contenteditable="true" spellcheck="false"></span>.
          <span id="optionalData" contenteditable="true" spellcheck="false"
            >03ffffffffff00</span
          >.
          <span id="dataCRC">00</span>
          <button id="sendButton">send</button>
        </div>

        <div id="result"></div>
        <enocean-monitor></enocean-monitor>
        <script type="module">
          import "./components/header.js";
          import "./components/monitor.js";
          import "./components/ed-prop-list.js";
          import { GatewayApiClient, utils } from "./gateway-api-client.js";
          const apiClient = new GatewayApiClient();
          let telegram = null;
          const telegramStringOutput = document.getElementById(
            "telegramStringOutput"
          );

          const sendButton = document.getElementById("sendButton");
          const packetType = document.getElementById("packetType");
          const optionalData = document.getElementById("optionalData");
          const data = document.getElementById("data");

          const baseId = (await apiClient.getBaseId()).baseId;
          data.innerText = `f600${baseId}00`;
          makePacket();

          optionalData.oninput = (event) => {
            makePacket();
            console.log("Optional Data changed:", event.target.value);
          };

          data.oninput = (event) => {
            makePacket();
            console.log("Data changed:", event.target.value);
          };

          packetType.oninput = (event) => {
            makePacket();
            console.log("Packet Type changed:", event.target.value);
          };

          sendButton.addEventListener("click", () => {
            apiClient.send(telegram).then((response) => {
              if (response.success === true) {
                console.log("Packet sent successfully");
              } else {
                console.error("Error sending packet:", response.error);
              }
            });
          });

          function makePacket() {
            const packetTypeValue = packetType.innerText;
            const dataValue = data.innerText;
            const optionalDataValue = optionalData.innerText;
            let packet = utils.createESP3Telegram(packetTypeValue);
            packet = utils.setData(packet, utils.fromString(dataValue));
            packet = utils.setOptionalData(
              packet,
              utils.fromString(optionalDataValue)
            );
            if (dataValue.length % 2 !== 0) {
              data.classList.add("err");
            } else {
              data.classList.remove("err");
            }
            if (optionalDataValue.length % 2 !== 0) {
              optionalData.classList.add("err");
            } else {
              optionalData.classList.remove("err");
            }
            if (packetTypeValue.length % 2 !== 0) {
              packetType.classList.add("err");
            } else {
              packetType.classList.remove("err");
            }
            telegram = utils.toString(packet);
            document.getElementById("headerCRC").innerText = utils
              .getHeaderCRC8(packet)
              .toString(16)
              .padStart(2, "0");
            document.getElementById("dataCRC").innerText = utils
              .getBodyCRC8(packet)
              .toString(16)
              .padStart(2, "0");
            document.getElementById("dataLength").innerText = utils
              .getDataLength(packet)
              .toString(16)
              .padStart(4, "0");
            document.getElementById("optionalLength").innerText = utils
              .getOptionalDataLength(packet)
              .toString(16)
              .padStart(2, "0");
            //console.log("Telegram:", utils.getHeaderCRC8(packet));
            //telegramStringOutput.innerHTML = telegram;
          }
        </script>
      </div>
    </div>
  </body>
</html>
