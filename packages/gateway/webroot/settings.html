<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enocean Gateway - Settings</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      .layout {
        display: flex;
        flex-direction: row;
        height: 100vh;
      }

      .main-content {
        flex: 1;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import "./components/header.js";
      import { EnoceanJSElement } from "./components/enocean-js-element.js";
      import "./components/material-icon.js";
      const apiClient = EnoceanJSElement.apiClient;
      const ports = await apiClient.listPorts();
      console.log("Available ports", ports);
      const list = document.getElementById("serialPortList");
      const select = document.getElementById("serialPortSelect");
      ports.forEach((port) => {
        const option = document.createElement("option");
        option.value = port.path;
        option.text = port.path;
        list.appendChild(option);
      });
      document
        .getElementById("connectButton")
        .addEventListener("click", async () => {
          const selectedPort = select.value;
          if (!selectedPort) {
            alert("Please select a serial port");
            return;
          }
          try {
            await apiClient.openPort(selectedPort);
            document.getElementById("status").innerText = "Status: Connected";
          } catch (error) {
            alert("Failed to connect: " + error.message);
          }
        });
    </script>
    <div class="layout">
      <header-component></header-component>
      <div class="main-content">
        <h1>Enocean Gateway Settings</h1>
        <input
          type="text"
          id="serialPortSelect"
          placeholder="Enter Serial Port"
          list="serialPortList"
        />
        <datalist id="serialPortList"> </datalist>

        <button id="refreshButton">Refresh</button>
        <button id="connectButton">Connect</button>
        <div id="status">Status: Disconnected</div>
      </div>
    </div>
  </body>
</html>
