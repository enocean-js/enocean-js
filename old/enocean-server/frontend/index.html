<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enocean Server Test Client</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        background: #2c3e50;
        color: white;
        padding: 1rem;
        text-align: center;
      }
      main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      #controls {
        width: 300px;
        padding: 1rem;
        border-right: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      #content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #devices,
      #log {
        padding: 1rem;
      }
      #log {
        flex: 1;
        background: #34495e;
        color: #ecf0f1;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.9rem;
      }
      #devices {
        height: 40%;
        overflow-y: auto;
        border-bottom: 1px solid #ccc;
      }
      h2 {
        margin-top: 0;
      }
      button {
        background: #3498db;
        color: white;
        border: none;
        padding: 0.75rem 1rem;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background: #2980b9;
      }
      .log-entry {
        padding: 2px 0;
        border-bottom: 1px solid #4a627a;
      }
      .log-event {
        font-weight: bold;
        color: #2ecc71;
      }
      pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Enocean Server Test Client</h1>
    </header>

    <main>
      <div id="controls">
        <h2>Controls</h2>
        <button id="btn-teach-in-start">Start Teach-in</button>
        <button id="btn-teach-in-stop">Stop Teach-in</button>
        <button id="btn-teach-out-start">Start Teach-out</button>
        <button id="btn-teach-out-stop">Stop Teach-out</button>
        <button id="btn-get-devices">Refresh Devices</button>
      </div>
      <div id="content">
        <div id="devices">
          <h2>Devices</h2>
          <pre id="devices-list">Click "Refresh Devices" to load.</pre>
        </div>
        <div id="log">
          <h2>Event Log</h2>
          <div id="log-content"></div>
        </div>
      </div>
    </main>

    <script>
      const logContent = document.getElementById("log-content");
      const devicesList = document.getElementById("devices-list");

      function logEvent(eventName, data) {
        const entry = document.createElement("div");
        entry.className = "log-entry";
        const prettyData = JSON.stringify(data, null, 2);
        entry.innerHTML = `<div><span class="log-event">[${eventName}]</span> - ${new Date().toLocaleTimeString()}</div><pre>${prettyData}</pre>`;
        logContent.prepend(entry);
      }

      // --- API Calls ---
      async function postControl(action) {
        try {
          await fetch(`/api/control/${action}`, { method: "POST" });
        } catch (e) {
          console.error(`Failed to ${action}:`, e);
          logEvent("error", { action, error: e.message });
        }
      }

      async function getDevices() {
        try {
          const response = await fetch("/api/devices");
          const devices = await response.json();
          devicesList.textContent = JSON.stringify(devices, null, 2);
          logEvent("info", "Fetched devices successfully.");
        } catch (e) {
          console.error("Failed to fetch devices:", e);
          logEvent("error", { action: "getDevices", error: e.message });
        }
      }

      // --- Event Listeners for Buttons ---
      document
        .getElementById("btn-teach-in-start")
        .addEventListener("click", () => postControl("teach-in/start"));
      document
        .getElementById("btn-teach-in-stop")
        .addEventListener("click", () => postControl("teach-in/stop"));
      document
        .getElementById("btn-teach-out-start")
        .addEventListener("click", () => postControl("teach-out/start"));
      document
        .getElementById("btn-teach-out-stop")
        .addEventListener("click", () => postControl("teach-out/stop"));
      document
        .getElementById("btn-get-devices")
        .addEventListener("click", getDevices);

      // --- SSE Connection ---
      logEvent("info", "Connecting to SSE event stream...");
      const eventSource = new EventSource("/api/events");

      eventSource.onopen = () => {
        logEvent("info", "SSE connection established.");
      };

      eventSource.onerror = (err) => {
        logEvent("error", "SSE connection error.");
        console.error("EventSource failed:", err);
      };

      // Generic listener for all named events from the server
      const eventNames = [
        "packet",
        "eep-learned",
        "removed-device",
        "new-device-seen",
        "new-profile-seen",
        "decoded-data",
        "decode-error",
        "unrecognized-data",
        "ute-response-sent",
        "ready",
        "teach-in-mode-timer",
        "teach-in-mode-ended",
        "teach-out-mode-timer",
        "teach-out-mode-ended",
        "error",
      ];

      eventNames.forEach((eventName) => {
        eventSource.addEventListener(eventName, (event) => {
          logEvent(eventName, JSON.parse(event.data));
        });
      });
    </script>
  </body>
</html>
